<div class="main-header">
  <div class="main-header-logo">
    <!-- Logo Header -->
    <div class="logo-header" data-background-color="dark">
      <a routerLink="/admin/dashboard" class="logo">
        <img
          src="assets/admin/img/kaiadmin/logo_light.svg"
          alt="Elygrad"
          class="navbar-brand"
          height="20"
        />
      </a>
      <div class="nav-toggle">
        <button class="btn btn-toggle toggle-sidebar" aria-label="Toggle sidebar">
          <i class="gg-menu-right"></i>
        </button>
        <button class="btn btn-toggle sidenav-toggler" aria-label="Toggle sidenav">
          <i class="gg-menu-left"></i>
        </button>
      </div>
      <button class="topbar-toggler more" aria-label="More options">
        <i class="gg-more-vertical-alt"></i>
      </button>
    </div>
    <!-- End Logo Header -->
  </div>

  <!-- Navbar Header -->
  <nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom">
    <div class="container-fluid">

      <!-- Desktop search bar -->
      <nav class="navbar navbar-header-left navbar-expand-lg navbar-form nav-search p-0 d-none d-lg-flex">
        <div class="input-group">
          <div class="input-group-prepend">
            <button type="button" class="btn btn-search pe-1" aria-label="Search">
              <i class="fa fa-search search-icon"></i>
            </button>
          </div>
          <input
            type="text"
            placeholder="Search ..."
            class="form-control"
            aria-label="Search admin panel"
          />
        </div>
      </nav>

      <ul class="navbar-nav topbar-nav ms-md-auto align-items-center">

        <!-- Mobile search -->
        <li class="nav-item topbar-icon dropdown hidden-caret d-flex d-lg-none">
          <a
            class="nav-link dropdown-toggle"
            data-bs-toggle="dropdown"
            href="#"
            role="button"
            aria-expanded="false"
            aria-label="Mobile search"
          >
            <i class="fa fa-search"></i>
          </a>
          <ul class="dropdown-menu dropdown-search animated fadeIn">
            <form class="navbar-left navbar-form nav-search">
              <div class="input-group">
                <input
                  type="text"
                  placeholder="Search ..."
                  class="form-control"
                  aria-label="Search"
                />
              </div>
            </form>
          </ul>
        </li>

        <!-- User profile dropdown -->
        <li class="nav-item topbar-user dropdown hidden-caret">
          <a
            class="dropdown-toggle profile-pic"
            data-bs-toggle="dropdown"
            href="#"
            aria-expanded="false"
            aria-label="User menu"
          >
            <!-- Initials avatar — no hard-coded image -->
            <div class="avatar-sm admin-initials-avatar">
              <span>{{ userInitial }}</span>
            </div>
            <span class="profile-username">
              <span class="op-7">Hello,</span>
              <span class="fw-bold">{{ userName }}</span>
            </span>
          </a>
          <ul class="dropdown-menu dropdown-user animated fadeIn">
            <div class="dropdown-user-scroll scrollbar-outer">
              <li>
                <div class="user-box">
                  <!-- Initials avatar in dropdown -->
                  <div class="avatar-lg admin-initials-avatar-lg">
                    <span>{{ userInitial }}</span>
                  </div>
                  <div class="u-text">
                    <h4>{{ userName }}</h4>
                    <p class="text-muted">Administrator</p>
                  </div>
                </div>
              </li>
              <li>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" routerLink="/admin/settings">Account Settings</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item text-danger" (click)="logout()" style="cursor:pointer;">
                  <i class="fas fa-sign-out-alt me-1"></i> Logout
                </a>
              </li>
            </div>
          </ul>
        </li>

      </ul>
    </div>
  </nav>
  <!-- End Navbar -->

</div>
