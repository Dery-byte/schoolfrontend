<!-- Sidebar HTML Template -->
<div class="sidebar" data-background-color="dark">
  <div class="sidebar-logo">
    <div class="logo-header" data-background-color="dark">
      <a routerLink="/admin/dashboard" class="logo">
        <img
          src="/assets/admin/assets/img/kaiadmin/logo_light.svg"
          alt="Elygrad Admin"
          class="navbar-brand"
          height="20"
        />
      </a>
      <div class="nav-toggle">
        <button class="btn btn-toggle toggle-sidebar" aria-label="Toggle sidebar">
          <i class="gg-menu-right"></i>
        </button>
        <button class="btn btn-toggle sidenav-toggler" aria-label="Toggle sidenav">
          <i class="gg-menu-left"></i>
        </button>
      </div>
      <button class="topbar-toggler more" aria-label="More options">
        <i class="gg-more-vertical-alt"></i>
      </button>
    </div>
  </div>

  <div class="sidebar-wrapper scrollbar scrollbar-inner">
    <div class="sidebar-content">
      <ul class="nav nav-secondary">

        <!-- Dashboard -->
        <li class="nav-item">
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:true}"
            (click)="closeSidebar()"
            aria-label="Dashboard"
          >
            <i class="fas fa-tachometer-alt"></i>
            <p>Dashboard</p>
          </a>
        </li>

        <li class="nav-section">
          <span class="sidebar-mini-icon">
            <i class="fa fa-ellipsis-h"></i>
          </span>
          <h4 class="text-section">University Management</h4>
        </li>

        <!-- Add University -->
        <li class="nav-item">
          <a routerLink="/admin/addUni" routerLinkActive="active" (click)="closeSidebar()" aria-label="Add University">
            <i class="fas fa-plus-circle"></i>
            <p>Add University</p>
          </a>
        </li>

        <!-- All Universities -->
        <li class="nav-item">
          <a routerLink="/admin/universities" routerLinkActive="active" (click)="closeSidebar()" aria-label="All Universities">
            <i class="fas fa-university"></i>
            <p>All Universities</p>
          </a>
        </li>

        <!-- Add Program -->
        <li class="nav-item">
          <a routerLink="/admin/addPrograms" routerLinkActive="active" (click)="closeSidebar()" aria-label="Add Program">
            <i class="fas fa-plus-square"></i>
            <p>Add Program</p>
          </a>
        </li>

        <!-- All Programs -->
        <li class="nav-item">
          <a routerLink="/admin/programs" routerLinkActive="active" (click)="closeSidebar()" aria-label="All Programs">
            <i class="fas fa-list-ul"></i>
            <p>All Programs</p>
          </a>
        </li>

        <!-- Colleges -->
        <li class="nav-item">
          <a routerLink="/admin/colleges" routerLinkActive="active" (click)="closeSidebar()" aria-label="Colleges">
            <i class="fas fa-building"></i>
            <p>Colleges</p>
          </a>
        </li>

        <li class="nav-section">
          <span class="sidebar-mini-icon">
            <i class="fa fa-ellipsis-h"></i>
          </span>
          <h4 class="text-section">Data & Users</h4>
        </li>

        <!-- Bulk Upload -->
        <li class="nav-item">
          <a routerLink="/admin/bulkUpload" routerLinkActive="active" (click)="closeSidebar()" aria-label="Bulk Upload">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Bulk Upload</p>
          </a>
        </li>

        <!-- Packages -->
        <li class="nav-item">
          <a routerLink="/admin/packages" routerLinkActive="active" (click)="closeSidebar()" aria-label="Package Management">
            <i class="fas fa-box-open"></i>
            <p>Packages</p>
          </a>
        </li>

        <!-- Users -->
        <li class="nav-item">
          <a routerLink="/admin/users" routerLinkActive="active" (click)="closeSidebar()" aria-label="Users">
            <i class="fas fa-users"></i>
            <p>Users</p>
          </a>
        </li>

        <!-- User Reports -->
        <li class="nav-item">
          <a routerLink="/admin/userReports" routerLinkActive="active" (click)="closeSidebar()" aria-label="User Reports">
            <i class="fas fa-chart-bar"></i>
            <p>User Reports</p>
          </a>
        </li>

        <!-- Biodata -->
        <li class="nav-item">
          <a routerLink="/admin/biodata" routerLinkActive="active" (click)="closeSidebar()" aria-label="Biodata">
            <i class="fas fa-id-badge"></i>
            <p>Biodata</p>
          </a>
        </li>

        <li class="nav-section">
          <span class="sidebar-mini-icon">
            <i class="fa fa-ellipsis-h"></i>
          </span>
          <h4 class="text-section">System</h4>
        </li>

        <!-- Settings -->
        <li class="nav-item">
          <a routerLink="/admin/settings" routerLinkActive="active" (click)="closeSidebar()" aria-label="Settings">
            <i class="fas fa-cog"></i>
            <p>Settings</p>
          </a>
        </li>

        <!-- Logout -->
        <li class="nav-item nav-logout">
          <a (click)="logout()" style="cursor:pointer;" aria-label="Logout">
            <i class="fas fa-sign-out-alt"></i>
            <p>Logout</p>
          </a>
        </li>

      </ul>
    </div>
  </div>
</div>
