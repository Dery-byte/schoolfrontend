<!-- ── Forgotten Password Modal ────────────────────────── -->
<div class="modal-backdrop" *ngIf="showorgottenPasswordModal" (click)="closeFogottenModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h3 class="modal-title">Reset Password</h3>
      <button class="modal-close" (click)="closeFogottenModal()" aria-label="Close modal">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div *ngIf="!showSuccessMessage" class="modal-body">
      <p class="modal-desc">Enter your email and we'll send you a password reset link.</p>
      <form [formGroup]="passwordResetForm" (ngSubmit)="passwordResetRequest()">
        <div class="form-field">
          <label class="form-label" for="reset-email">Email address</label>
          <input
            id="reset-email"
            class="form-input"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <span class="field-err"
                *ngIf="passwordResetForm.get('email')?.invalid && passwordResetForm.get('email')?.touched">
            Valid email required.
          </span>
          <span class="field-err" *ngIf="apiError">{{ apiError }}</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" (click)="closeFogottenModal()">Cancel</button>
          <button
            type="submit"
            class="btn-primary"
            [disabled]="passwordResetForm.invalid || isSubmitting">
            <span *ngIf="!isSubmitting">Send Reset Link</span>
            <span *ngIf="isSubmitting" class="btn-spin-row">
              <span class="spin"></span> Sending…
            </span>
          </button>
        </div>
      </form>
    </div>

    <div *ngIf="showSuccessMessage" class="modal-success">
      <div class="success-icon">✅</div>
      <p>Reset link sent! Check your inbox.</p>
      <button class="btn-primary" (click)="closeFogottenModal()">Done</button>
    </div>

  </div>
</div>
